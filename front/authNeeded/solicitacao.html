<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Solicitação de Devolução - IFAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/local.css">
    <script src="/authNeeded/solicitacao.js" defer></script>
</head>
<body>
    <div class="d-flex">
        <nav class="sidebar-custom text-white p-3">
            <div class="sidebar-brand mb-4">
                <div class="d-flex align-items-center gap-2">
                    <span class="ifal-dot"></span>
                    <span>Achados & Perdidos</span>
                </div>
                <span class="sidebar-badge">Campus IFAL</span>
            </div>
            <div class="nav flex-column">
                <a class="nav-link" href="/u/objetos"><i class="bi bi-box-seam"></i> Objetos</a>
                <a class="nav-link" href="/u/locais"><i class="bi bi-geo-alt"></i> Locais</a>
                <a class="nav-link active-link" href="/u/solicitacoes"><i class="bi bi-clipboard-check-fill"></i> Solicitações</a>
                <a class="nav-link" href="/u/etiquetas"><i class="bi bi-tags"></i> Etiquetas</a>
                <a class="nav-link" href="/u/categorias"><i class="bi bi-grid"></i> Categorias</a>
            </div>
        </nav>

        <div class="d-flex flex-column flex-grow-1">
            <nav class="navbar navbar-expand topbar-custom px-4">
                <div class="d-flex align-items-center gap-2 text-success fw-bold small">
                    <i class="bi bi-building-check fs-5"></i>
                    <span>Sistema Institucional de Achados e Perdidos</span>
                </div>
                <div class="ms-auto d-flex align-items-center gap-3">
                    <span class="user-pill d-flex align-items-center gap-2">
                        <i class="bi bi-person-circle"></i>
                        Sessão Ativa
                    </span>
                    <a href="#" class="btn btn-outline-danger btn-sm btn-rounded" id="sair_btn">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </a>
                </div>
            </nav>

            <div class="p-4">
                <div class="hero-banner mb-4 d-flex justify-content-between align-items-center">
                    <div style="position: relative; z-index: 1;">
                        <span class="hero-tag"><i class="bi bi-plus-circle"></i> Reivindicação de Item</span>
                        <h3 class="fw-bold mb-1" id="main-title">Solicitação de Devolução</h3>
                        <p class="mb-0 text-white-50 small">Informe onde e quando você perdeu o objeto e descreva suas características.</p>
                    </div>
                    <div class="hero-illustration d-none d-md-flex align-items-center gap-3">
                        <i class="bi bi-clipboard2-plus-fill fs-2 text-white"></i>
                    </div>
                </div>

                <div class="card card-modern p-4" style="max-width: 720px;">
                    <form action="/solicitacao" method="post" class="main2">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-success" for="turno">
                                    <i class="bi bi-clock me-1"></i> Turno
                                </label>
                                <select class="form-select form-control-modern" name="turno" id="turno">
                                    <option value="matutino">Matutino</option>
                                    <option value="vespertino">Vespertino</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-success" for="date">
                                    <i class="bi bi-calendar-event me-1"></i> Data em que foi perdido
                                </label>
                                <input type="date" id="date" class="form-control form-control-modern">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-success" for="bloco">
                                    <i class="bi bi-building me-1"></i> Bloco
                                </label>
                                <select class="form-select form-control-modern" name="bloco" id="bloco">
                                    <option value="placeholder">Selecione um bloco</option>
                                    <option value="info">Informática</option>
                                    <option value="quimica">Química</option>
                                    <option value="eletrotecnica">Eletrotécnica</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-success" for="local">
                                    <i class="bi bi-geo-alt me-1"></i> Local / Sala
                                </label>
                                <select class="form-select form-control-modern" disabled name="local" id="local">
                                    <option value="placeholder">Selecione um bloco primeiro</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-success" for="descricao">
                                <i class="bi bi-card-text me-1"></i> Descrição do Objeto
                            </label>
                            <textarea id="descricao" class="form-control form-control-modern" rows="5" placeholder="Descreva marca, cor, modelo, adesivos ou detalhes que comprovem que o item é seu..."></textarea>
                        </div>

                        <div class="d-flex gap-2 pt-2">
                            <button type="submit" class="btn btn-ifal d-flex align-items-center gap-2" id="btn">
                                <i class="bi bi-check-circle-fill"></i> Enviar Solicitação
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-rounded" id="btn_voltar" onclick="document.location.href='/u/solicitacoes'">
                                <i class="bi bi-arrow-left me-1"></i> Voltar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const btn = document.querySelector("#sair_btn")
        btn.addEventListener('click', async (e) => {
            e.preventDefault()
            let a = await fetch('/api/user/logout')
            let c = await a.json()
            alert(c.msg)
            if (a.ok) {
                document.location.href = '/i/login'
            }
        })
    </script>
</body>
</html>
