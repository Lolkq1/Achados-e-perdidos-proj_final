<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local do Achados e Perdidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <nav class="bg-dark text-white p-3 min-vh-100" style="width: 250px;">
            <h4 class="mb-4">Achados e Perdidos</h4>
            <div class="nav flex-column">
                <a class="nav-link text-white" href="objeto.html">Objetos</a>
                <a class="nav-link text-white bg-success rounded" href="local.html">Locais</a>
                <a class="nav-link text-white" href="solicitacao.html">Solicitações</a>
                <a class="nav-link text-white " href="/logout"> Sair</a>
            </div>
        </nav>
        <div class="flex-grow-1 p-4">
            <h2>Locais Cadastrados</h2>
            <button type="button" class="btn btn-success mb-3">+ Novo Local</button>
        
            <table class="table">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome do Local</th>
                        <th>Bloco</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Entrada Principal</td>
                        <td>Bloco de Informatica</td>
                        <td>
                            <button type="button" class="btn btn-success">Atualizar</button>
                            <button type="button" class="btn btn-danger">Remover</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>SANE</td>
                        <td>Bloco Principal</td>
                        <td>
                            <button type="button" class="btn btn-success">Atualizar</button>
                            <button type="button" class="btn btn-danger">Remover</button>
                        </td>
                    </tr>    
                    <tr>
                        <td>3</td>
                        <td>Biblioteca</td>
                        <td>Bloco de Química</td>
                        <td>
                            <button type="button" class="btn btn-success">Atualizar</button>
                            <button type="button" class="btn btn-danger">Remover</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            <hr>
            <h3>Cadastrar Novo Local</h3>
            <form>
                <div class="mb-3">
                    <label class="form-label">Nome do Local</label>
                    <input type="text" class="form-control border-success border-2" style="max-width: 300px"> 
                </div>
                <div class="mb-3">
                    <label class="form-label">Bloco</label>
                    <input type="text" class="form-control border-success border-2" style="max-width: 300px">
                </div>
                <div>
                    <button type="button" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
