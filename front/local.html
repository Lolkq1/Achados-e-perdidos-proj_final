<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local do Achados e Perdidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="d-flex">
        <div>
            <nav class="bg-dark text-white p-3 min-vh-100" style="width: 250px;">
            <h4 class="mb-4">Achados e Perdidos</h4>
            <div class="nav flex-column">
                <a class="nav-link text-white" href="objeto.html">Objetos</a>
                <a class="nav-link text-white bg-success rounded" href="local.html">Locais</a>
                <a class="nav-link text-white" href="solicitacao.html">Solicitações</a>
            </div>
        </nav>
        </div>
        <div class="d-flex flex-column">
            <div>
                <nav class="navbar navbar-expand-lg navbar-light bg-light min-vw-100" style="height: 50px;">
                <div class="collapse navbar-collapse" style="position: relative; left: 70%;">
                    <div class="navbar-nav">
                        <a href="" class="nav-item nav-link disabled">joaozinhodobiu123@gmail.com</a>
                        <a href="" class="nav-item nav-link">Sair</a>
                    </div>
                </div>
                </nav>
            </div>
            <div>
            <div class="flex-grow-1 p-4">
            <h2>Locais Cadastrados</h2>
            <button type="button" class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#modalLocal">+ Novo Local</button>
            <table class="table">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome do Local</th>
                        <th>Bloco</th>
                        <th>Ações</th>
                        <th>Filtro(simbolo)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Entrada Principal</td>
                        <td>Bloco de Informatica</td>
                        <td>
                            <button type="button" class="btn btn-success">Atualizar</button>
                            <button type="button" class="btn btn-danger">Remover</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>SANE</td>
                        <td>Bloco Principal</td>
                        <td>
                            <button type="button" class="btn btn-success">Atualizar</button>
                            <button type="button" class="btn btn-danger">Remover</button>
                        </td>
                    </tr>    
                    <tr>
                        <td>3</td>
                        <td>Biblioteca</td>
                        <td>Bloco de Química</td>
                        <td>
                            <button type="button" class="btn btn-success">Atualizar</button>
                            <button type="button" class="btn btn-danger">Remover</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="modal fade" id="modalLocal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cadastrar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Local</label>
                            <input type="text" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Bloco</label>
                            <input type="text" class="form-control">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
            </div>
        </div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
