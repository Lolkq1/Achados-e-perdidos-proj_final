<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "style.css">
    <title>Cadastro de Objetos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <div>
         <nav class="bg-dark text-white p-3 min-vh-100" style="width: 250px;">
            <h4 class="mb-4">Achados e Perdidos</h4>
            <div class="nav flex-column">
                <a class="nav-link text-white bg-success rounded" href="objeto.html">Objetos</a>
                <a class="nav-link text-white" href="local.html">Locais</a>
                <a class="nav-link text-white" href="solicitacao.html">Solicitações</a>
            </div>
        </nav>
    </div>
    <div class="d-flex flex-column">
        <div>
        <div>
            <nav class="navbar navbar-expand-lg navbar-light bg-light min-vw-100" style="height: 50px;">
            <div class="collapse navbar-collapse" style="position: relative; left: 70%;">
                <div class="navbar-nav">
                    <a href="" class="nav-item nav-link disabled">joaozinhodobiu123@gmail.com</a>
                    <a href="" class="nav-item nav-link">Sair</a>
                </div>
            </div>
        </nav>
        </div>
        <div>
            <div id = "divPai" style="display: relative; left: 50%; transform: translate(-50%, 10%);";>
        <h1>Cadastrar Novo Objeto</h1>
        <form>
           <h3>Informações do Objeto</h3>
            <div class="form-group my-2">
                <label for ="titulo">Titulo (Nome do Item)</label>
                <input class="form-control" type ="text" id ="titulo" name ="titulo" placeholder="Digite o nome do objeto">
            </div>
            <div class="form-group my-2">
                <label for = "categoria">Categoria</label>
                <select class="form-select" id ="categoria" name ="categoria">
                    <option value = "eletronica">Eletrônica</option>  
                    <option value = "chaves">Chaves</option>  
                    <option value = "documentos">Documentos</option>  
                    <option value = "roupas">Roupas</option>  
                    <option value = "outros">Outros</option>  
                </select>
            </div>
            <div class="form-group my-2">
                 <h3>Local e Data</h3>
            <div class = "row">
                <div class = "column">
                    <label for ="data">Data do Ocorrido</label>
                    <input type ="datetime-local" id = "data" name ="data">
            </div>
                <div class = "column">
                    <label for ="local">Local onde foi encontrado</label>
                    <input class="form-control" type ="text" id ="local" name ="local" placeholder="Descreva o local">
                </div>
            </div>
            </div>
            <h3>Etiquetas</h3>
            <div class = "divEtqMae">
            <div class = "Etq">
                <label for ="cor">Cor</label>
                <input class="form-control" type = "text" id ="cor" name ="cor" placeholder="Ex: Preto, Azul, Vermelho">
            </div>
            <div class = "Etq">
                 <label for ="marca">Marca</label>
                <input type = "text" class="form-control" id ="marca" name ="marca" placeholder="Ex: Nike, Samsung">
            </div>
            <div class = "Etq">
                 <label for ="material">Material</label>
                <input class="form-control" type = "text" id ="material" name ="material" placeholder="Ex: Plástico">
            </div>
            </div>
            <div class = "descriçao">
                <label for ="descricao">Descrição Detalhada</label>
                <textarea id ="descricao" name="descricao" rows="4" cols="30"></textarea>
            </div>
            <button type ="submit" class = "btn btn-success">Cadastrar</button>
        </form>
    </div>
        </div>
    </div>
    </div>
    </div>
    
</body>
</html>
