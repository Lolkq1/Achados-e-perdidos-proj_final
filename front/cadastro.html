<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <form action="/cadastro" method="post" class="main2">
        <h1 class="m-2" id="main-title">Cadastro</h1>
        <div class="form-group mx-2 my-3">
            <label class="my-2" for="nome" style="display: block;">Nome</label>
            <input type="text" id="nome" style="display: block;">
        </div>
        <div class="form-group mx-2 my-3">
            <label class="my-2" for="email" style="display: block;">Email</label>
            <input type="text" id="email" style="display: block;">
        </div>
        <div class="form-group mx-2 my-3">
            <label class="my-2" for="senha" style="display: block;">Senha</label>
            <input type="password" id="senha" style="display: block;">
            <button class="btn btn-success my-3" id="btn">Entrar</button>
            <p class="form-text">Já possui uma conta? <a style="text-decoration: none;" href="/Achados-e-perdidos-proj_final/front/login.html">Faça login</a></p>
        </div>
    </form>
</body>
</html>
